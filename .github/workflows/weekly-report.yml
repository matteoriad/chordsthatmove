name: Weekly report

# Mondays: which format, slot and look did best on Instagram in the last 14 days
# (pipeline/insights.py). Opens an issue (GitHub emails it) and commits reports/.

on:
  schedule:
    - cron: "43 6 * * 1"   # Monday 07:43 Berlin (winter), 08:43 (summer)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: weekly-report

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/insights.py
      - name: Keep the report
        run: |
          git config user.name "chordsthatmove-bot"
          git config user.email "chordsthatmove-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || { git commit -m "Weekly report"; git pull -q --rebase origin main; git push; }
