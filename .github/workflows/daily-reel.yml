name: Daily reel

on:
  schedule:
    # 10:00 Berlin all year: GitHub cron is UTC, so fire at 08:02 and 09:02 UTC
    # and let the "Berlin 10 o'clock" step below keep only the run in Berlin's 10:xx hour.
    - cron: "2 8,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post to Instagram"
        type: boolean
        default: true
      episode:
        description: "Optional: force a specific episode number"
        required: false

permissions:
  contents: write

concurrency: daily-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Berlin 10 o'clock
        id: gate
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "10" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "It's ${H}:xx in Berlin, not 10:xx: skipping this run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - name: System packages
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Render and post
        if: steps.gate.outputs.go == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EPISODE: ${{ inputs.episode }}
        run: |
          git config user.name "chordsthatmove-bot"
          git config user.email "chordsthatmove-bot@users.noreply.github.com"
          python pipeline/post.py

      - name: Keep the rendered files
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
