name: Daily reel

on:
  schedule:
    # Target: 10:00 Berlin. Cron is UTC and GitHub drops runs at the top of the hour,
    # so fire at :41 in three UTC hours; pipeline/gate.py waits until 10:00 Berlin
    # and makes sure only one run posts per day (the others are backups).
    - cron: "41 7,8,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post to Instagram"
        type: boolean
        default: true
      episode:
        description: "Optional: force a specific episode number"
        required: false
  push:
    # Changing .github/post-now posts the next episode immediately.
    branches: [main]
    paths: [".github/post-now"]

permissions:
  contents: write

concurrency: daily-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Posting window (10:00 Berlin)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: python3 pipeline/gate.py

      - name: System packages
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Render and post
        if: steps.gate.outputs.go == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EPISODE: ${{ inputs.episode }}
        run: |
          git config user.name "chordsthatmove-bot"
          git config user.email "chordsthatmove-bot@users.noreply.github.com"
          git pull -q --rebase origin main
          python pipeline/post.py

      - name: Keep the rendered files
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
