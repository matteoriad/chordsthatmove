name: Daily reel

on:
  schedule:
    # Targets: 01:00 and 13:00 Berlin. Cron is UTC and GitHub drops runs at the top of
    # the hour, so fire at :41 in the UTC hours around each slot (covers CET and CEST);
    # pipeline/gate.py waits for the slot and makes sure only one run posts per slot
    # (the others are backups or skip).
    - cron: "41 22,23,0,1 * * *"
    - cron: "41 10,11,12,13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post to Instagram"
        type: boolean
        default: true
      episode:
        description: "Optional: force a specific episode number"
        required: false
      crosspost_only:
        description: "Only put already-posted episodes on YouTube/TikTok (no Instagram post)"
        type: boolean
        default: false
  push:
    # Changing .github/post-now posts the next episode immediately.
    branches: [main]
    paths: [".github/post-now"]

permissions:
  contents: write

concurrency: daily-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Posting window (01:00 / 13:00 Berlin)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: python3 pipeline/gate.py

      - name: System packages
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Render and post
        if: steps.gate.outputs.go == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EPISODE: ${{ inputs.episode }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          CROSSPOST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.crosspost_only || false }}
        run: |
          git config user.name "chordsthatmove-bot"
          git config user.email "chordsthatmove-bot@users.noreply.github.com"
          git pull -q --rebase origin main
          if [ "$CROSSPOST_ONLY" = "true" ]; then python pipeline/crosspost.py; else python pipeline/post.py; fi

      - name: Keep the rendered files
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
