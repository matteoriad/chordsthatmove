name: Daily reel

on:
  schedule:
    # Targets: 01, 05, 09, 13, 17 and 21 Berlin (every 4 h). Cron is UTC and GitHub drops
    # runs at the top of the hour, so fire at :41 every hour (covers CET and CEST);
    # pipeline/gate.py waits for the slot and makes sure only one run posts per slot
    # (the others are backups or skip).
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post to Instagram"
        type: boolean
        default: true
      episode:
        description: "Optional: force a specific episode number"
        required: false
      crosspost_only:
        description: "Only put already-posted episodes on YouTube/TikTok (no Instagram post)"
        type: boolean
        default: false
  push:
    # Changing .github/post-now posts the next episode immediately.
    branches: [main]
    paths: [".github/post-now"]

permissions:
  contents: write

concurrency: daily-reel

jobs:
  post:
    runs-on: ubuntu-24.04
    # The gate step can sleep up to ~60 min waiting for the slot, so leave room for the build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Posting window (every 4 h from 01:00 Berlin)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: python3 pipeline/gate.py

      - name: System packages
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 30
        run: |
          # The runner's default mirror (azure.archive.ubuntu.com) sometimes stops answering,
          # which used to stall this step until its timeout. Probe it first, cap each install
          # attempt, and fall back to archive.ubuntu.com if the mirror is slow or down.
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=10"
          PKGS="ffmpeg libcairo2-dev pkg-config"
          use_main_mirror() {
            echo "::warning::apt mirror unreachable or too slow, switching to archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt; do
              [ -f "$f" ] && sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$f"
            done
            return 0
          }
          apt_install() {
            sudo apt-get update -q $APT_OPTS &&
            sudo timeout 480 apt-get install -y -q --no-install-recommends $APT_OPTS $PKGS
          }
          curl -fsS --max-time 10 -o /dev/null http://azure.archive.ubuntu.com/ubuntu/dists/noble/Release || use_main_mirror
          apt_install || { use_main_mirror; apt_install; }

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Render and post
        if: steps.gate.outputs.go == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EPISODE: ${{ inputs.episode }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          CROSSPOST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.crosspost_only || false }}
        run: |
          git config user.name "chordsthatmove-bot"
          git config user.email "chordsthatmove-bot@users.noreply.github.com"
          git pull -q --rebase origin main
          if [ "$CROSSPOST_ONLY" = "true" ]; then python pipeline/crosspost.py; else python pipeline/post.py; fi

      - name: Keep the rendered files
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
